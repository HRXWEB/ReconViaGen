[project]
name = "reconviagen"
version = "0.5.0"
description = "ReconViaGen v0.5 Blackwell inference environment"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "easydict==1.13",
    "einops==0.8.1",
    "fast-simplification==0.1.13",
    "gradio==6.0.1",
    "huggingface-hub==1.7.2",
    "igraph==0.11.8",
    "imageio==2.36.1",
    "imageio-ffmpeg==0.5.1",
    "kornia==0.8.2",
    "lpips==0.1.4",
    "ninja==1.13.0",
    "numpy==1.26.4",
    "onnxruntime==1.20.1",
    "open3d==0.19.0",
    "opencv-python-headless==4.10.0.84",
    "packaging>=24.2",
    "pillow==10.4.0",
    "plyfile==1.1.2",
    "pymeshfix==0.17.0",
    "pyvista==0.44.2",
    "rembg==2.0.60",
    "rtree==1.4.1",
    "scipy==1.14.1",
    "setuptools>=75.1",
    "spconv-cu120==2.3.6",
    "timm==0.6.7",
    "torch==2.7.1",
    "torchvision==0.22.1",
    "tqdm==4.67.1",
    "transformers==5.3.0",
    "trimesh==4.5.3",
    "utils3d @ git+https://github.com/EasternJournalist/utils3d.git@9a4eb15e4021b67b12c460c7057d642626897ec8",
    "wheel>=0.45.1",
    "xatlas==0.0.9",
    "zstandard==0.23.0",
]

[tool.uv]
package = false
required-version = ">=0.10.10"
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
